name: Build Orkeit Desktop APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: oriket-desktop-apk-build
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep the same debug signing key between CI builds so Android can update
      # the installed APK instead of rejecting it because its signature changed.
      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: orkeit-desktop-debug-signing-key-v1
      - name: Install Android 16 SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -n 1)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build direct-distribution debug APK
        run: gradle assembleDirectDebug -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
      - name: Prepare update package
        run: cp app/build/outputs/apk/direct/debug/app-direct-debug.apk app/build/outputs/apk/direct/debug/orkeit-desktop.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orkeit-desktop-direct-debug-apk
          path: app/build/outputs/apk/direct/debug/app-direct-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish/update latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: main
          name: Oriket Desktop Latest
          body: |
            Automated Oriket Desktop update.
            {
              "versionCode": ${{ github.run_number }},
              "versionName": "1.0.${{ github.run_number }}"
            }
          files: app/build/outputs/apk/direct/debug/orkeit-desktop.apk
          overwrite_files: true
          make_latest: false
          prerelease: true
