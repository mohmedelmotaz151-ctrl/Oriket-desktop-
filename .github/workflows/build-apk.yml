name: Build Oriket Desktop APK (Capacitor)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: oriket-desktop-capacitor-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Reuse the exact key that signed the previous 1.0.135 direct APK.
      # Never generate a replacement key silently: that would block in-place updates.
      - name: Restore original stable Android signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: orkeit-desktop-debug-signing-key-v1

      - name: Restore signing key from repository secret if cache is unavailable
        if: steps.signing-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          else
            echo "::error::The original signing key cache is unavailable. Add ANDROID_DEBUG_KEYSTORE_BASE64 containing the ORIGINAL key used for the installed APK; do not generate a new key."
            exit 1
          fi

      - name: Verify signing key is present
        run: |
          test -s "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          echo "Original Oriket Desktop signing key restored."

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install web and Capacitor dependencies
        run: |
          npm install --no-audit --no-fund
          npm run android:prepare

      - name: Build Windows 11 web interface and piano
        run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Set monotonic Android version
        run: |
          VERSION_CODE=$((135 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Apply package, version, landscape and legacy ad settings
        run: node scripts/prepare-capacitor-android.mjs

      - name: Build signed Android APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/orkeit-desktop.apk
          sha256sum release/orkeit-desktop.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orkeit-desktop-capacitor-apk
          path: release/orkeit-desktop.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest direct-download APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: main
          name: Oriket Desktop Latest
          body: |
            Automated Capacitor Android update.
            {
              "versionCode": ${{ env.VERSION_CODE }},
              "versionName": "${{ env.VERSION_NAME }}"
            }
          files: release/orkeit-desktop.apk
          overwrite_files: true
          make_latest: false
          prerelease: true
