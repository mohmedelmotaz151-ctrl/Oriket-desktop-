name: Validate Oriket Android terminal changes

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses and install platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm run android:prepare
      - name: Check TypeScript and build web app
        run: npm run build
      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Generate native plugins and Android permissions
        env:
          VERSION_CODE: '136'
          VERSION_NAME: '1.0.136-terminal-test'
        run: node scripts/prepare-capacitor-android.mjs
      - name: Compile Android debug APK (no release publishing)
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug
